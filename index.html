    margin:0;
    padding:0;
    box-sizing:border-box;

html,body{
    overflow-x:hidden;

body{
    font-family:Arial,sans-serif;
    color:#fff;
    text-align:center;

    background:
    linear-gradient(rgba(0,0,0,0.72), rgba(0,0,0,0.92)),
    url('https://hallenfootballclub.co.uk/uploads/2023/07/which-site-could-i-watch-free-live-soccer-streaming-on.webp');

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

/* 🔝 TOP BANNER */
.top-banner{
    position:fixed;
    top:0;
    width:100%;
    height:60px;
    background:rgba(0,0,0,0.82);
    backdrop-filter:blur(6px);
    z-index:9999;
    display:flex;
    justify-content:center;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

/* 🔻 BOTTOM BANNER */
.bottom-banner{
    position:fixed;
    bottom:0;
    width:100%;
    height:60px;
    background:rgba(0,0,0,0.82);
    backdrop-filter:blur(6px);
    z-index:9999;
    display:flex;
    justify-content:center;
    align-items:center;
    border-top:1px solid rgba(255,255,255,0.08);
}

.container{
    padding:80px 12px;
    width:100%;
}

/* 🔴 LIVE BADGE */
.live-badge{
    background:linear-gradient(45deg,#ff0000,#ff3c3c);
    padding:10px 22px;
    border-radius:40px;
    font-weight:bold;
    letter-spacing:1px;
    display:inline-block;
    margin-bottom:18px;
    box-shadow:0 0 18px rgba(255,0,0,0.8);
    animation:blink 1s infinite;
}

@keyframes blink{
    0%,100%{opacity:1;}
    50%{opacity:0.6;}
}

/* 🏆 TITLE */
h1{
    font-size:42px;
    margin-bottom:10px;
}

.sub-text{
    color:#ddd;
    font-size:17px;
    margin-bottom:25px;
}

/* 🔥 PLAYER BOX FIX (INI INTI MASALAH HP) */
.player-box{
    position:relative;
    width:92%;
    max-width:720px;
    margin:20px auto;
    border-radius:22px;
    overflow:hidden;
    cursor:pointer;

    aspect-ratio:16/9; /* 🔥 FIX UTAMA */

    box-shadow:
        0 0 30px rgba(255,0,0,0.55),
        0 0 80px rgba(255,0,0,0.25);

    transition:.4s ease;
}

.player-box img{
    width:100%;
    height:100%;
    object-fit:cover; /* 🔥 penting buat GIF biar nggak “kepotong aneh” */
    display:block;
}

/* DARK OVERLAY */
.player-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0.15));
}

/* 🔥 PLAY BUTTON */
.play-btn{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    width:110px;
    height:110px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);
    border:2px solid rgba(255,255,255,0.28);
    box-shadow:0 0 25px rgba(255,0,0,0.6);
    animation:pulseGlow 1.8s infinite;
}

/* ▶ ICON */
.play-icon{
    font-size:50px;
}

/* hover */
.player-box:hover{
    transform:scale(1.015);
}

/* CTA */
.cta-btn{
    display:inline-block;
    margin-top:28px;
    padding:18px 38px;
    font-size:19px;
    font-weight:bold;
    color:#fff;
    text-decoration:none;
    border-radius:60px;
    background:linear-gradient(45deg,#ff0000,#ff6a00);
    box-shadow:0 0 20px rgba(255,0,0,0.75);
    animation:pulseBtn 1.3s infinite;
}

/* animations */
@keyframes pulseBtn{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.06);}
}

@keyframes pulseGlow{
    0%,100%{box-shadow:0 0 15px rgba(255,0,0,0.4);}
    50%{box-shadow:0 0 45px rgba(255,0,0,0.9);}
}

/* 📱 MOBILE FIX */
@media(max-width:768px){

    h1{
        font-size:30px;
    }

    .play-btn{
        width:85px;
        height:85px;
    }

    .play-icon{
        font-size:38px;
    }

    .cta-btn{
        font-size:17px;
        padding:16px 30px;
    }
}
</style>
